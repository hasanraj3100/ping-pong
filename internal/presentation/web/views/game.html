<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ping Pong Game</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="game-page">
  <div class="game-card">
    <div class="player">
      <h2>{{.Game.Player1.Name}}</h2>
      <span id="player1-ready" class="ready-badge not-ready">
        <span class="ready-dot"></span><span id="player1ReadyState">Not Ready</span>
      </span>
      <div id="player1-score" class="score">0</div>
    </div>

    <div class="share-box">
      <label for="share-link">Invite a friend</label>
      <div class="share-row">
        <input id="share-link" type="text" readonly value="{{.ShareURL}}" />
        <button id="copy-btn" type="button">Copy</button>
      </div>
    </div>

    <div class="player">
      {{if .Game.Player2.UUID}}
        <h2 id="player2-name">{{.Game.Player2.Name}}</h2>
        <span id="player2-ready" class="ready-badge not-ready">
          <span class="ready-dot"></span><span id="player2ReadyState">Not Ready</span>
        </span>
      {{else}}
        <h2 id="player2-name" class="waiting">Waiting for player&hellip;</h2>
        <span id="player2-ready" class="ready-badge not-ready hidden">
          <span class="ready-dot"></span><span id="player2ReadyState">Not Ready</span>
        </span>
      {{end}}
      <div id="player2-score" class="score">0</div>
    </div>
  </div>

  <div class="game-stage">
    <canvas id="game-canvas"></canvas>
  </div>
  <script>
    const myRole = "{{.Role}}"; // "player1", "player2", or "spectator"
    let curr_sequence = 0;
    let curr_ready_status = false;

    document.getElementById("copy-btn").addEventListener("click", () => {
      const input = document.getElementById("share-link");
      input.select();
      navigator.clipboard?.writeText(input.value);
    });

    const gameID = "{{.Game.ID}}";
    const wsProtocol = location.protocol === "https:" ? "wss:" : "ws:";
    const ws = new WebSocket(`${wsProtocol}//${location.host}/games/${gameID}/ws`);

    ws.addEventListener("message", (event) => {
      const msg = JSON.parse(event.data);

      if (msg.Type == "match_found") {
        const player2El = document.getElementById("player2-name");
        const player2ReadyEl = document.getElementById("player2-ready");

        if (msg.Opponent ) {
          player2El.textContent = msg.Opponent;
          player2El.classList.remove("waiting");
          player2ReadyEl.classList.remove("hidden");
        }
      }

      else if (msg.Type == "move") {

        if (msg.Player === "player1") {
          if (myRole === "player1" && msg.Sequence < curr_sequence) return; // stale data
          window.p1TargetY = msg.YPos;
          return;
        }

        if (msg.Player === "player2") {
          if (myRole === "player2" && msg.Sequence < curr_sequence) return; // stale data
          window.p2TargetY = msg.YPos;
          return;
        }

        return;
      }

      else if (msg.Type == "ball") {
        window.ballX = msg.X;
        window.ballY = msg.Y;
        return;
      }

      else if (msg.Type == "score") {
        document.getElementById("player1-score").textContent = msg.Player1Score;
        document.getElementById("player2-score").textContent = msg.Player2Score;
        curr_ready_status = false;
        return;
      }

      else if (msg.Type == "ready") {
        const player1Ready = msg.Player1Ready;
        const player2Ready = msg.Player2Ready;

        const player1ReadyEl = document.getElementById("player1-ready");
        const player2ReadyEl = document.getElementById("player2-ready");
        const player1ReadyState = document.getElementById("player1ReadyState");
        const player2ReadyState = document.getElementById("player2ReadyState");

        player1ReadyEl.classList.toggle("ready", player1Ready);
        player1ReadyEl.classList.toggle("not-ready", !player1Ready);
        player1ReadyState.textContent = player1Ready ? "Ready" : "Not Ready";

        player2ReadyEl.classList.toggle("ready", player2Ready);
        player2ReadyEl.classList.toggle("not-ready", !player2Ready);
        player2ReadyState.textContent = player2Ready ? "Ready" : "Not Ready";
      }
      
    });

    const MOVE_INTERVAL_MS = 50;
    const pressedKeys = { up: false, down: false, space : false };

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowUp") pressedKeys.up = true;
      if (event.key === "ArrowDown") pressedKeys.down = true;
      if (event.key === " ") pressedKeys.space = true;
    });

    document.addEventListener("keyup", (event) => {
      if (event.key === "ArrowUp") pressedKeys.up = false;
      if (event.key === "ArrowDown") pressedKeys.down = false;
      if (event.key === " ") pressedKeys.space = false;
    });

    function updateYValue(value) {
      if (myRole === "player1") {
        window.p1TargetY += value;
      } else {
        window.p2TargetY += value;
      }
    }

    setInterval(() => {
      if (ws.readyState !== WebSocket.OPEN) return;

      if (pressedKeys.up) {
        curr_sequence++;
        updateYValue(-10);
        ws.send(JSON.stringify({ Type: "move", Value: "u" , Sequence: curr_sequence}));
      }

      if (pressedKeys.down) {
        curr_sequence++; 
        updateYValue(10);
        ws.send(JSON.stringify({ Type: "move", Value: "d", Sequence: curr_sequence }));
      }

      if (pressedKeys.space && !curr_ready_status) {
        curr_ready_status = true;
        ws.send(JSON.stringify({Type: "ready"}));
      }
    }, MOVE_INTERVAL_MS);
  </script>


  <script type="module" src="/static/main.js"></script>
</body>
</html>
