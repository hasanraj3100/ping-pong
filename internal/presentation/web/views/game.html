<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ping Pong Game</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="game-page">
  <div class="game-card">
    <div class="player">
      <h2>{{.Game.Player1.Name}}</h2>
      <div class="score">0</div>
    </div>

    <div class="share-box">
      <label for="share-link">Invite a friend</label>
      <div class="share-row">
        <input id="share-link" type="text" readonly value="{{.ShareURL}}" />
        <button id="copy-btn" type="button">Copy</button>
      </div>
    </div>

    <div class="player">
      {{if .Game.Player2.UUID}}
        <h2 id="player2-name">{{.Game.Player2.Name}}</h2>
      {{else}}
        <h2 id="player2-name" class="waiting">Waiting for player&hellip;</h2>
      {{end}}
      <div class="score">0</div>
    </div>
  </div>

  <div class="game-stage">
    <canvas id="game-canvas"></canvas>
  </div>
  <script>
    document.getElementById("copy-btn").addEventListener("click", () => {
      const input = document.getElementById("share-link");
      input.select();
      navigator.clipboard?.writeText(input.value);
    });

    const gameID = "{{.Game.ID}}";
    const wsProtocol = location.protocol === "https:" ? "wss:" : "ws:";
    const ws = new WebSocket(`${wsProtocol}//${location.host}/games/${gameID}/ws`);

    ws.addEventListener("message", (event) => {
      const msg = JSON.parse(event.data);

      if (msg.Player === "player1") {
        window.p1TargetY = msg.YPos;
        return;
      }
      if (msg.Player === "player2") {
        window.p2TargetY = msg.YPos;
        return;
      }

      const game = msg;
      const player2El = document.getElementById("player2-name");

      if (game.Player2 && game.Player2.UUID) {
        player2El.textContent = game.Player2.Name;
        player2El.classList.remove("waiting");
      }
    });

    const MOVE_INTERVAL_MS = 50;
    const pressedKeys = { up: false, down: false };

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowUp") pressedKeys.up = true;
      if (event.key === "ArrowDown") pressedKeys.down = true;
    });

    document.addEventListener("keyup", (event) => {
      if (event.key === "ArrowUp") pressedKeys.up = false;
      if (event.key === "ArrowDown") pressedKeys.down = false;
    });

    setInterval(() => {
      if (ws.readyState !== WebSocket.OPEN) return;

      if (pressedKeys.up) {
        ws.send(JSON.stringify({ Type: "move", Value: "u" }));
      }
      if (pressedKeys.down) {
        ws.send(JSON.stringify({ Type: "move", Value: "d" }));
      }
    }, MOVE_INTERVAL_MS);
  </script>


  <script type="module" src="/static/main.js"></script>
</body>
</html>
