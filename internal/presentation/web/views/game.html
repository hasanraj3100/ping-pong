<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ping Pong Game</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="game-card">
    <div class="player">
      <h2>{{.Game.Player1.Name}}</h2>
      <div class="score">0</div>
    </div>

    <div class="board">
      <div class="board-surface">🏓</div>
      <div class="share-box">
        <label for="share-link">Invite a friend</label>
        <div class="share-row">
          <input id="share-link" type="text" readonly value="{{.ShareURL}}" />
          <button id="copy-btn" type="button">Copy</button>
        </div>
      </div>
    </div>

    <div class="player">
      {{if .Game.Player2.UUID}}
        <h2>{{.Game.Player2.Name}}</h2>
      {{else}}
        <h2 class="waiting">Waiting for player&hellip;</h2>
      {{end}}
      <div class="score">0</div>
    </div>
  </div>

  <script>
    document.getElementById("copy-btn").addEventListener("click", () => {
      const input = document.getElementById("share-link");
      input.select();
      navigator.clipboard?.writeText(input.value);
    });
  </script>
</body>
</html>
